[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homoglyph-detector"
version = "0.3.0"
description = "Detect homoglyph / IDN homograph look-alikes in domains, emails, URLs and names (UTS #39)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
keywords = ["homoglyph", "homograph", "idn", "phishing", "unicode", "uts39", "blue-team"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
homoglyph-detector = "homoglyph_detector.cli:main"

[tool.setuptools.package-data]
homoglyph_detector = ["data/*"]
