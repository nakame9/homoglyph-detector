name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]   # every version pyproject.toml supports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python scripts/seal_data.py --check   # every data file pinned in MANIFEST.json
      - run: pytest -q
        env:
          HYPOTHESIS_PROFILE: ci   # deterministic property tests, 400 examples each
      - run: homoglyph-detector -f examples/sample_domains.txt || [ $? -eq 2 ]
      - name: Calibration must match the committed engines and benchmark
        if: matrix.python-version == '3.13'
        run: python benchmark/calibrate.py && git diff --exit-code src/homoglyph_detector/data/

  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/seal_data.py --check
      - run: python -m homoglyph_detector --verify
      - run: python -m pytest -q
        env:
          HYPOTHESIS_PROFILE: ci
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m venv "$env:RUNNER_TEMP\homoglyph-wheel"
      - name: Verify the wheel in a clean environment
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'homoglyph-wheel\Scripts\python.exe'
          & $python -m pip install (Get-Item dist/*.whl).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m homoglyph_detector --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m homoglyph_detector xn--pypal-4ve.com
          if ($LASTEXITCODE -ne 2) { throw 'Expected the wheel to flag a malicious host' }
          exit 0

  minimum-versions:
    # installs the lowest versions pyproject.toml allows, so the declared floors stay true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.10 && uv pip install --resolution lowest-direct -e ".[dev]"
      - run: uv pip list | grep -Ei "^(idna|publicsuffixlist|pytest|hypothesis) "
      - run: .venv/bin/pytest -q
        env:
          HYPOTHESIS_PROFILE: ci
